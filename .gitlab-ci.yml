default:
  tags:
    - for:application-project
    - host:restricted-container
    - net:gold-dev

  cache:
    untracked: false
    key: $CI_PROJECT_ID
    paths:
      - .m2/repository

workflow:
  rules:
    # toujours si lancé volontairement depuis l'interface
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: always
    # toujours sur un tag pour publier la release de l'image
    - if: '$CI_COMMIT_TAG'
      when: always
    # pour éviter le doublon lors d'un tag
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_COMMIT_MESSAGE =~ /^Release /'
      when: never
    # toujours pour merge request
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: always
    # jamais sur les branches s'il y a des MR ouvertes
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - when: always  

# ---------------------------------------------------------- #
# --------------------  Variables  ------------------------- #
# ---------------------------------------------------------- #
variables:
  MAVEN_BUILD_IMAGE: $DOCKER_URL/ch/ge/cti/build/ubi-jdk-maven-node:U10.1-20251124_121200-J25-M3.9.12-N24.13.0
  JAVA_RUNTIME_IMAGE: $DOCKER_URL/ch/ge/cti/build/ubi-jdk-maven-node:U10.1-20251124_121200-J25-M3.9.12-N24.13.0

include:
  - component: $COMPOSANTS_MOYENS_DEV_URL/container/full-ci-buildah@2.1.0
    inputs:
      buildah_image_name: ch/ge/filjava/$CI_PROJECT_NAME
      buildah_job_before_script_custom:
        - export BUILDAH_BUILD_ARGS="--build-arg JAVA_RUNTIME_IMAGE=$JAVA_RUNTIME_IMAGE"

verify:
  stage: build
  image: $MAVEN_BUILD_IMAGE
  script:
    - mvn -B -ntp clean verify
  artifacts:
    expire_in: 1 day
    paths:
      - ui/target/*.jar
      - "**/target/classes/**"
      - "**/target/site/jacoco/jacoco.xml"

build_image_snapshot_or_release:
  needs:
    - job: verify
      artifacts: true

sonar:
  variables:
    SONAR_EXCLUSIONS: "**/test/**"
    SONAR_COVERAGE_EXCLUSIONS: "**/rest/generated/**,**/config/**,**/FiljavaApplication.java,**/ui/security/**,**/*Entity.java"
  needs:
    - job: verify
      artifacts: true

# -------------------------------------
# Documentation OpenAPI
# -------------------------------------
pages:
  stage: .post
  image: $MAVEN_BUILD_IMAGE
  cache: []
  script:
    - mkdir -p public
    - cp ui/src/main/resources/swagger-ui/index.html public/index.html
    - find ui/src/main/resources/openapi -maxdepth 1 -type f \( -name '*.yaml' -o -name '*.yml' \) -exec cp {} public/ \;
    - printf 'window.OPENAPI_CONTRACTS = [\n' > public/swagger-config.js
    - find ui/src/main/resources/openapi -maxdepth 1 -type f \( -name '*.yaml' -o -name '*.yml' \) -printf '%f\n' | sort | sed 's|.*|  { url\x3a "./&", name\x3a "&" },|' >> public/swagger-config.js
    - printf '];\n' >> public/swagger-config.js
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

