spring:
  application:
    name: filjava-app-template-backend

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${GINA_ISSUER_URI}

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST}:5432/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

cxf:
  path: /services

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        liveness:
          include: applicationLiveness
          show-details: always
        readiness:
          include: readinessState,db
          show-details: always

  health:
    readinessstate:
      enabled: true

  metrics:
    tags:
      application: ${spring.application.name}

  info:
    env:
      enabled: true

  prometheus:
    metrics:
      export:
        enabled: true

info:
  app:
    name: FILJAVA Backend Template
    description: Template backend Java destiné au développement de services applicatifs
    version: "@project.version@"
