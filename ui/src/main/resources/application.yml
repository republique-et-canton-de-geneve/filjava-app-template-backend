spring:
  application:
    name: filjava-app-template-backend

  security:
    oauth2:
      client:
        registration:
          gina:
            provider: gina
            client-id: ${GINA_CLIENT_ID}
            client-secret: ${GINA_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/auth/callback/{registrationId}"
            scope: openid,profile
        provider:
          gina:
            issuer-uri: ${GINA_ISSUER_URI}
      resourceserver:
        jwt:
          issuer-uri: ${GINA_ISSUER_URI}

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST}:5432/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

cxf:
  path: /services

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState,applicationStatus
          show-details: always
        readiness:
          include: readinessState,databaseStatus
          show-details: always

  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

  metrics:
    tags:
      application: ${spring.application.name}

  info:
    env:
      enabled: true

  prometheus:
    metrics:
      export:
        enabled: true

info:
  app:
    name: FILJAVA Backend Template
    description: Template backend Java destiné au développement de services applicatifs
    version: "@project.version@"

app:
  frontend-url: ${FRONTEND_URL}
